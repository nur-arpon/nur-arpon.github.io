<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>SpaceZ share image (1200 x 630)</title>
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../assets/fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; }
  @font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #07080a; color: #f1f2ec; font-family: "Space Grotesk", sans-serif; position: relative; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.16) 1px, transparent 1.5px); background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse 60% 75% at 78% 50%, #000 15%, transparent 75%); }
  .glow { position: absolute; right: -120px; top: 50%; width: 760px; height: 760px; translate: 0 -50%; background: radial-gradient(circle, rgba(200,255,46,.22), transparent 62%); }
  .copy { position: absolute; left: 72px; top: 84px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 700; letter-spacing: -.035em; }
  .brand svg { width: 64px; height: 64px; }
  .brand .z { color: #c8ff2e; }
  h1 { font-size: 84px; line-height: .95; letter-spacing: -.05em; margin: 64px 0 28px; font-weight: 600; }
  h1 span { color: #c8ff2e; }
  p { font-size: 26px; color: #a7aca3; margin: 0; letter-spacing: -.01em; line-height: 1.35; }
  .url { position: absolute; left: 72px; bottom: 56px; font-family: "JetBrains Mono", monospace; font-size: 20px; color: #767b73; letter-spacing: .02em; }
  .orbit { position: absolute; right: 70px; top: 50%; width: 430px; height: 430px; translate: 0 -50%; }
  .orbit svg.r { position: absolute; inset: 0; }
  .orbit .core { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; translate: -50% -50%; border-radius: 36px; background: #07080a; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 0 0 12px rgba(200,255,46,.06), 0 30px 80px -10px rgba(200,255,46,.3); display: grid; place-items: center; }
  .orbit .core svg { width: 84px; height: 84px; }
  .orbit img { position: absolute; width: 64px; height: 64px; border-radius: 18px; translate: -50% -50%; box-shadow: 0 14px 30px -10px rgba(0,0,0,.7); }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#07080A" stroke="rgba(255,255,255,.18)"/><path d="M18 19H45L19 45H37.5" fill="none" stroke="#C8FF2E" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47.5" cy="45" r="4.25" fill="#C8FF2E"/></svg>
      <span>Space<span class="z">Z</span></span>
    </div>
    <h1>From idea<br>to installed<span>.</span></h1>
    <p>Nur Ifran Arpon and SpaceZ: apps for Windows and Android, and websites, built and shipped.</p>
  </div>
  <div class="url">nur-arpon.github.io</div>
  <div class="orbit">
    <svg class="r" viewBox="0 0 430 430" fill="none">
      <ellipse cx="215" cy="215" rx="130" ry="130" stroke="rgba(255,255,255,.14)"/>
      <ellipse cx="215" cy="215" rx="172" ry="172" stroke="rgba(200,255,46,.45)"/>
      <ellipse cx="215" cy="215" rx="212" ry="212" stroke="rgba(255,255,255,.14)" stroke-dasharray="2 7"/>
    </svg>
    <div class="core"><svg viewBox="0 0 64 64"><path d="M18 19H45L19 45H37.5" fill="none" stroke="#C8FF2E" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47.5" cy="45" r="4.25" fill="#C8FF2E"/></svg></div>
    <img src="../assets/img/work/icon-spaceadom.webp" alt="" style="left:93%;top:28%">
    <img src="../assets/img/work/icon-spike.webp" alt="" style="left:14%;top:22%">
    <img src="../assets/img/work/icon-filez.webp" alt="" style="left:22%;top:86%">
    <img src="../assets/img/work/icon-mistri.webp" alt="" style="left:82%;top:84%">
  </div>
</body>
</html>
